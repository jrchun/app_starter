# Cloudflare Worker 설정(이 파일이 기준이다). name은 대시보드의 Worker 이름과 같아야 한다.
# name, database_name, database_id는 scripts/cf_mcp.mjs fill(또는 wrangler d1 create 출력)로 채운다.
# 편집 암호는 여기 두지 않는다. 사이트에서 처음 저장할 때 화면에서 정한다(D1에 해시로 저장).
# 대시보드 › Worker › 설정 › 변수 및 비밀 › Secret WRITE_TOKEN을 넣으면 그것이 우선한다.
name = "my-app"
main = "./src/worker.js"
compatibility_date = "2026-11-01"
# 옛 workers.dev 주소도 계속 연다. 아래 [[routes]](내 도메인 주소)를 넣으면 Cloudflare가 workers.dev를 끄기 때문에 꼭 적어 둔다.
workers_dev = true
send_metrics = false

# 정적 파일. 요청과 맞는 파일이 있으면 Worker를 거치지 않고 바로 보낸다. 없을 때만 src/worker.js가 실행된다.
[assets]
directory = "./web"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "my-app"
database_id = "__D1_DATABASE_ID__"

# 예약 작업(src/jobs.js). UTC 기준: 매일 07:30 KST. 무료 플랜은 계정 전체에서 Cron Trigger 5개까지다.
[triggers]
crons = ["30 22 * * *"]

# 내 도메인 주소(https://<앱이름>.<내 도메인>)는 fill이 CLAUDE.md의 "내 도메인:" 줄을 보고 맨 아래에 [[routes]]로 넣는다.
