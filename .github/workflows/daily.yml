# 매일 작업(jobs/daily.py). 필요한 설정: 저장소 Settings › Secrets and variables › Actions
#   › Secrets 탭 › Repository secrets › CLOUDFLARE_API_TOKEN (Variables 탭이 아니다)
# 계정 ID와 DB ID는 비밀이 아니라 아래에 적는다(scripts/setup_cloudflare.py가 채운다).
# 예약 실행은 기본 브랜치(main)에 이 파일이 있어야 동작한다. Actions 탭에서 손으로도 실행할 수 있다.
name: daily

on:
  schedule:
    - cron: '30 22 * * *' # 매일 07:30 KST (UTC 22:30). GitHub 사정으로 늦을 수 있다
  workflow_dispatch: {}

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Daily job
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: __CF_ACCOUNT_ID__
          CF_D1_DATABASE_ID: __D1_DATABASE_ID__ # wrangler.toml과 같아야 한다
        run: python3 -m jobs.daily
