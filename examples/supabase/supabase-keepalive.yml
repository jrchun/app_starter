# Supabase 잠들기 방지: 무료 플랜은 7일 동안 요청이 없으면 프로젝트를 멈춘다. 하루 한 번 깨운다.
# 공개 키(publishable)만 쓰므로 GitHub 비밀이 필요 없다. 예약 실행은 기본 브랜치(main)에 있어야 동작한다.
name: supabase-keepalive

on:
  schedule:
    - cron: '17 21 * * *' # 매일 06:17 KST
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: __SUPABASE_URL__
          SUPABASE_KEY: __SUPABASE_PUBLISHABLE_KEY__
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Supabase responded: $code"
          test "$code" = "200"
